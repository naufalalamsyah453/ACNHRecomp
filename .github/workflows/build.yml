# The release packages (README "Downloads"): the launcher and the player, which plays the game folder
# ACNHRecomp-Importer prepared, with the libraries they need; nothing of the game. One per system, each built on the
# oldest one it should run on. Run from the Actions tab (Build > Run workflow): the packages are attached to a GitHub
# release of this repository, and kept as artifacts of the run too.
#
# Builds are serialized: one at a time, in this repository (the concurrency group below), and the systems are built
# one after the other rather than side by side. A failed system does not stop the others, but the release is only
# published when all three succeeded.
name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (release tag and package names; v is added when missing)"
        required: true
        default: "v1.0.0-keyboard"
      draft:
        description: "Publish as a draft release"
        type: boolean
        default: false

permissions:
  contents: write  # creating the release and uploading the packages

concurrency:
  group: acnh-build  # shared with ci.yml: one build (or verify) at a time in this repository
  cancel-in-progress: false

env:
  SDL3: "3.4.16"          # as tools/setup_acnh.py
  VK_HEADERS: "1.4.357"   # as tools/setup_acnh.py

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v=${INPUT:-${GITHUB_SHA::7}}
          [[ $v =~ ^[A-Za-z0-9._-]+$ ]] || { echo "version: letters, digits and . _ - only"; exit 1; }
          tag=$v; [[ $tag == v* ]] || tag=v$tag
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NX_RELEASE_VERSION: ${{ needs.version.outputs.version }}  # the version the programs show (#76)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the launcher's version (git describe)
      - uses: ilammy/msvc-dev-cmd@v1  # vcvars64: clang-cl links against the Windows SDK and the C runtime
        with:
          arch: x64
      - name: SDL3, Vulkan headers
        run: |
          T=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSL -o "$T/sdl.zip" "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3/SDL3-devel-$SDL3-VC.zip"
          7z x -bso0 -o"$RUNNER_TEMP" "$T/sdl.zip"
          curl -fsSL "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v$VK_HEADERS.tar.gz" | tar -xz -C "$T"
      - name: libvpx, libvorbis (vcpkg)
        run: |
          "$(cygpath -u "$VCPKG_INSTALLATION_ROOT")/vcpkg.exe" install libvpx:x64-windows-static-md-release \
              libvorbis:x64-windows-static-md-release zlib:x64-windows-static-md-release --disable-metrics
      - name: Package
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          T=$(cygpath -m "$RUNNER_TEMP")
          tools/package_release_win.sh "$VERSION" "$T/SDL3-$SDL3" \
              "$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows-static-md-release" \
              "$T/Vulkan-Headers-$VK_HEADERS/include"
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows-x64
          path: private/release/ACNHRecomp-${{ env.VERSION }}-windows-x64.zip
          archive: false
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: [version, windows]  # after Windows: one build at a time
    if: ${{ always() && needs.version.result == 'success' && !cancelled() }}
    runs-on: macos-15  # GitHub dropped macos-14; Homebrew's libraries here need macOS 15 (checked by the package script)
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NX_RELEASE_VERSION: ${{ needs.version.outputs.version }}  # the version the programs show (#76)
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tools
        run: brew install ninja sdl3 molten-vk vulkan-loader vulkan-headers libvpx libvorbis
      - name: Package
        run: tools/package_release_mac.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: package-macos-arm64
          path: private/release/ACNHRecomp-${{ env.VERSION }}-macOS-arm64.zip
          archive: false
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: [version, macos]  # last: one build at a time
    if: ${{ always() && needs.version.result == 'success' && !cancelled() }}
    runs-on: ubuntu-22.04  # glibc 2.35: what the package runs on, and newer
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NX_RELEASE_VERSION: ${{ needs.version.outputs.version }}  # the version the programs show (#76)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tools
        run: |
          sudo apt-get update
          # clang 18 (apt.llvm.org); SDL3's build dependencies (SDL's docs/README-linux.md): it loads these libraries
          # at run time when present; the game's: Vulkan, libvpx, libvorbis.
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s 18
          sudo apt-get install -y --no-install-recommends ninja-build patchelf pkg-config \
               libvulkan-dev libvpx-dev libvorbis-dev \
               libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
               libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
               libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev \
               wayland-protocols libdecor-0-dev
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL3 }}-linux-x64
      - name: SDL3, Vulkan headers
        run: |
          # Ubuntu 22.04's Vulkan headers (1.3.204) are older than the runtime's
          curl -fsSL "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v$VK_HEADERS.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          if [ ! -f "$RUNNER_TEMP/sdl3/lib/cmake/SDL3/SDL3Config.cmake" ]; then
            curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3/SDL3-$SDL3.tar.gz" |
              tar -xz -C "$RUNNER_TEMP"
            cmake -S "$RUNNER_TEMP/SDL3-$SDL3" -B "$RUNNER_TEMP/sdl3-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
                  -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
            cmake --build "$RUNNER_TEMP/sdl3-build"
            cmake --install "$RUNNER_TEMP/sdl3-build"
          fi
      - name: Package
        env:
          CC: clang-18
          CXX: clang++-18
        run: tools/package_release_linux.sh "$VERSION" "$RUNNER_TEMP/sdl3" "$RUNNER_TEMP/Vulkan-Headers-$VK_HEADERS/include"
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-x64
          path: private/release/ACNHRecomp-${{ env.VERSION }}-linux-x64.tar.gz
          archive: false
          if-no-files-found: error

  release:
    name: Release
    needs: [version, windows, macos, linux]
    if: ${{ needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          ls -la dist
          notes=$(cat <<EOF
          ACNHRecomp $VERSION — a build of this fork.

          Native PC port of Animal Crossing: New Horizons (static recompilation). It contains no game code or assets:
          it plays the game folder ACNHRecomp-Importer prepares from your own copy.

          Highlights of this build: in-game button prompts as keyboard keycaps (Controls > Button icons > Keyboard),
          following your own key bindings.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            args=()
            if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
            gh release create "$TAG" dist/* --title "ACNHRecomp $VERSION" --notes "$notes" \
               --repo "$GITHUB_REPOSITORY" "${args[@]}"
          fi
