# The release package (README "Downloads"): the launcher and the player, which plays the game folder
# ACNHRecomp-Importer prepared, with the libraries they need; nothing of the game. Built on the oldest system it
# should run on (Ubuntu 22.04: glibc 2.35). Run from the Actions tab (Build > Run workflow): the package is attached
# to a GitHub release of this repository, as both the release's .zip and the usual .tar.gz, and kept as an artifact
# of the run too.
#
# Linux is the only system this fork packages. Builds are serialized: one at a time, in this repository (the
# concurrency group below, shared with ci.yml).
name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (release tag and package names; v is added when missing)"
        required: true
        default: "v1.0.1-keyboard"
      draft:
        description: "Publish as a draft release"
        type: boolean
        default: false

permissions:
  contents: write  # creating the release and uploading the package

concurrency:
  group: acnh-build  # shared with ci.yml: one build (or verify) at a time in this repository
  cancel-in-progress: false

env:
  SDL3: "3.4.16"          # as tools/setup_acnh.py
  VK_HEADERS: "1.4.357"   # as tools/setup_acnh.py

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v=${INPUT:-${GITHUB_SHA::7}}
          [[ $v =~ ^[A-Za-z0-9._-]+$ ]] || { echo "version: letters, digits and . _ - only"; exit 1; }
          tag=$v; [[ $tag == v* ]] || tag=v$tag
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x64
    needs: version
    runs-on: ubuntu-22.04  # glibc 2.35: what the package runs on, and newer
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NX_RELEASE_VERSION: ${{ needs.version.outputs.version }}  # the version the programs show (#76)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tools
        run: |
          sudo apt-get update
          # clang 18 (apt.llvm.org); SDL3's build dependencies (SDL's docs/README-linux.md): it loads these libraries
          # at run time when present; the game's: Vulkan, libvpx, libvorbis.
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s 18
          sudo apt-get install -y --no-install-recommends ninja-build patchelf pkg-config \
               libvulkan-dev libvpx-dev libvorbis-dev \
               libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
               libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
               libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev \
               wayland-protocols libdecor-0-dev
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL3 }}-linux-x64
      - name: SDL3, Vulkan headers
        run: |
          # Ubuntu 22.04's Vulkan headers (1.3.204) are older than the runtime's
          curl -fsSL "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v$VK_HEADERS.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          if [ ! -f "$RUNNER_TEMP/sdl3/lib/cmake/SDL3/SDL3Config.cmake" ]; then
            curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3/SDL3-$SDL3.tar.gz" |
              tar -xz -C "$RUNNER_TEMP"
            cmake -S "$RUNNER_TEMP/SDL3-$SDL3" -B "$RUNNER_TEMP/sdl3-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
                  -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
            cmake --build "$RUNNER_TEMP/sdl3-build"
            cmake --install "$RUNNER_TEMP/sdl3-build"
          fi
      - name: Package
        env:
          CC: clang-18
          CXX: clang++-18
        run: tools/package_release_linux.sh "$VERSION" "$RUNNER_TEMP/sdl3" "$RUNNER_TEMP/Vulkan-Headers-$VK_HEADERS/include"
      - name: Package zip
        run: |
          # The same tree as the .tar.gz, in a .zip (the archive the README's Downloads list names). ZipInfo.from_file
          # keeps the executables' permission bits.
          python3 - <<'EOF'
          import os, tarfile, tempfile, zipfile
          version = os.environ["VERSION"]
          tar_path = f"private/release/ACNHRecomp-{version}-linux-x64.tar.gz"
          zip_path = f"private/release/ACNHRecomp-{version}-linux-x64.zip"
          with tempfile.TemporaryDirectory() as tmp, \
               zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              with tarfile.open(tar_path) as t:
                  t.extractall(tmp)
              for root, dirs, files in os.walk(tmp):
                  dirs.sort()
                  for name in sorted(files):
                      p = os.path.join(root, name)
                      info = zipfile.ZipInfo.from_file(p, os.path.relpath(p, tmp))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      with open(p, "rb") as f:
                          z.writestr(info, f.read())
          print(zip_path, os.path.getsize(zip_path))
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-x64
          path: |
            private/release/ACNHRecomp-${{ env.VERSION }}-linux-x64.zip
            private/release/ACNHRecomp-${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: [version, linux]
    if: ${{ needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          ls -la dist
          notes=$(cat <<EOF
          ACNHRecomp $VERSION — a build of this fork (Linux x64).

          Native PC port of Animal Crossing: New Horizons (static recompilation). It contains no game code or assets:
          it plays the game folder ACNHRecomp-Importer prepares from your own copy.

          Highlights of this build: in-game button prompts as keyboard keycaps (Controls > Button icons > Keyboard),
          following your own key bindings. A game folder prepared by ACNHRecomp-Importer has no fonts/: the
          package's glyphs-gen makes the keycaps from your own RomFS on the first start (a few seconds, once).
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            args=()
            if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
            gh release create "$TAG" dist/* --title "ACNHRecomp $VERSION (Linux x64)" --notes "$notes" \
               --repo "$GITHUB_REPOSITORY" "${args[@]}"
          fi
