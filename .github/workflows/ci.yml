# Checks before a release is built: the tools (no game data), the runtime (the player and its unit tests), and the
# byte-level steps the keyboard icons use, whose zstd frame a real decoder then reads. It needs no game data: the
# player is configured with NX_GAME_FROM_FOLDER, as the release package is, and the generated glyphs stay in private/.
#
# Runs on every push and from the Actions tab. Shares its concurrency group with build.yml: one build or verify at a
# time in this repository, and a new push waits for the running one instead of cancelling it.
name: Verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acnh-build  # shared with build.yml
  cancel-in-progress: false

env:
  SDL3: "3.4.16"          # as tools/setup_acnh.py and build.yml
  VK_HEADERS: "1.4.357"   # as tools/setup_acnh.py and build.yml

jobs:
  verify:
    name: Runtime and tools
    runs-on: ubuntu-22.04  # the oldest system the release runs on (glibc 2.35)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No game data in the change
        run: |
          git add -A
          tools/check_no_game_data.sh
      - name: Tools
        run: |
          sudo apt-get update
          # clang 18 (apt.llvm.org); SDL3's build dependencies (SDL's docs/README-linux.md); zstd reads the frames the
          # glyph test writes; the game's: Vulkan, libvpx, libvorbis.
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s 18
          sudo apt-get install -y --no-install-recommends ninja-build zstd pkg-config \
               libvulkan-dev libvpx-dev libvorbis-dev \
               libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
               libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
               libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev \
               wayland-protocols libdecor-0-dev
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL3 }}-linux-x64
      - name: SDL3, Vulkan headers
        run: |
          # Ubuntu 22.04's Vulkan headers (1.3.204) are older than the runtime's
          curl -fsSL "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v$VK_HEADERS.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          if [ ! -f "$RUNNER_TEMP/sdl3/lib/cmake/SDL3/SDL3Config.cmake" ]; then
            curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3/SDL3-$SDL3.tar.gz" |
              tar -xz -C "$RUNNER_TEMP"
            cmake -S "$RUNNER_TEMP/SDL3-$SDL3" -B "$RUNNER_TEMP/sdl3-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
                  -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
            cmake --build "$RUNNER_TEMP/sdl3-build"
            cmake --install "$RUNNER_TEMP/sdl3-build"
          fi
      - name: Python tools
        run: |
          python3 -m py_compile tools/*.py
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check fonttools zstandard
          "$RUNNER_TEMP/venv/bin/python" tools/make_button_glyphs.py --selftest
      - name: glyphs-gen (the package's keyboard icons generator)
        run: |
          # Frozen like the package's: an executable with fontTools and zstandard inside, which must run on its own
          # (--selftest at the end of the script: the game folder that has no fonts/ gets its icons from it).
          tools/package_glyphs_gen.sh
      - name: Dear ImGui
        run: |
          # As tools/setup_acnh.py: the settings screen is only compiled with it (uistub otherwise), and the
          # controls page and its translations are part of what this job builds.
          mkdir -p private/third_party/imgui
          curl -fsSL https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9.tar.gz |
            tar -xz --strip-components=1 -C private/third_party/imgui
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build -G Ninja -DNX_GAME=acnh -DNX_GEN_DIR="$PWD/build/no-gen" \
                -DCMAKE_BUILD_TYPE=Release -DNX_TESTS=ON -DNX_GAME_FROM_FOLDER=ON -DNX_LAUNCHER=OFF \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3" \
                -DNX_VULKAN_INCLUDE="$RUNNER_TEMP/Vulkan-Headers-$VK_HEADERS/include"
      - name: Build the player and the tests
        run: cmake --build build --target acnh glyph_patch_test astc_test tiling_test gpu_pick_test
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: The glyph test's zstd frames
        run: |
          out=build/glyph_patch_out
          zstd -d -c "$out/frame.zs" | cmp - "$out/expected.bin"
          zstd -d -c "$out/small.zs" | cmp - <(printf 'x%.0s' {1..100})
